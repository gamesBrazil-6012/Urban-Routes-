
name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar projeto
        run: |
          mkdir -p www/lib
          cp Urban_Routes_v16.html www/index.html
          i=0
          for url in $(grep -oE 'https://(cdnjs\.cloudflare\.com|cdn\.jsdelivr\.net)[^"]+\.js' www/index.html | sort -u); do
            i=$((i+1))
            curl -sfL "$url" -o "www/lib/$i.js"
            sed -i "s|$url|lib/$i.js|g" www/index.html
          done
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.urbanroutes.game","appName":"Urban Routes","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: urban-routes-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
